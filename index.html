<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1f4b" />
    <meta name="description" content="Squash ratings for every player. Log your matches and watch your level move." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <style>
      /* Boot skeleton: shown until React mounts and replaces #root's contents. */
      :root { --black: #0a0a0a; --white: #ffffff; --yellow: #ffd60a; --navy: #0b1f4b; }
      .boot { min-height: 100dvh; background: color-mix(in oklab, var(--navy) 3%, var(--white)); }
      .boot-bar { height: 56px; background: color-mix(in oklab, var(--navy) 78%, var(--black)); display: flex; align-items: center; gap: 8px; padding: 0 16px; }
      .boot-logo { width: 32px; height: 32px; border-radius: 8px; background: var(--navy); display: grid; place-items: center; }
      .boot-logo::after { content: ''; width: 14px; height: 14px; border-radius: 50%; background: var(--yellow); }
      .boot-main { max-width: 64rem; margin: 0 auto; padding: 24px 16px; display: grid; gap: 10px; }
      .boot-row { height: 64px; border-radius: 12px; }
      .boot-title { height: 28px; width: 160px; border-radius: 8px; margin-bottom: 8px; }
      .boot-sk { background-color: color-mix(in oklab, var(--navy) 9%, var(--white)); background-image: linear-gradient(90deg, transparent, rgb(255 255 255 / 0.7), transparent); background-size: 200% 100%; background-repeat: no-repeat; animation: boot-shimmer 1.4s ease-in-out infinite; }
      @keyframes boot-shimmer { from { background-position: 150% 0; } to { background-position: -50% 0; } }
      @media (prefers-color-scheme: dark) {
        .boot { background: color-mix(in oklab, var(--navy) 48%, var(--black)); }
        .boot-bar { background: color-mix(in oklab, var(--navy) 48%, var(--black)); border-bottom: 1px solid var(--navy); }
        .boot-sk { background-color: color-mix(in oklab, var(--navy) 55%, var(--black)); background-image: linear-gradient(90deg, transparent, rgb(255 255 255 / 0.08), transparent); }
      }
      @media (prefers-reduced-motion: reduce) { .boot-sk { animation: none; } }
    </style>
    <title>Boast — squash ratings</title>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-busy="true" aria-label="Loading Boast">
        <div class="boot-bar"><span class="boot-logo"></span></div>
        <div class="boot-main">
          <div class="boot-sk boot-title"></div>
          <div class="boot-sk boot-row"></div>
          <div class="boot-sk boot-row"></div>
          <div class="boot-sk boot-row"></div>
          <div class="boot-sk boot-row"></div>
          <div class="boot-sk boot-row"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
